<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>footer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <footer class="p-5 text-white" style="background-color: #2D6A8A;">
        <div class="container">
            <div class="row">
                <!-- Logo e información -->
                <div class="col-12 col-md-5 mb-4 mb-md-0">
                    <div><img src="../../../assets/img/logo.jpg" alt="logo" width="50" height="50"></div>
                        <p class="mt-4">
                            Vive el encanto del océano. Descansa con alma.
                        </p>
                </div>
                <!-- Sección de enlaces -->
                <div class="col-12 col-md-3 mb-4 mb-md-0">
                    <h4>Hotel</h4>
                    <p class="mt-2">Sobre nosotros</p>
                    <p>Información legal</p>
                </div>
                <!-- Sección de contacto -->
                <div class="col-12 col-md-4">
                    <h4>Contáctanos</h4>
                    <p class="mt-2">Tel: 3121231122</p>
                    <p>Email: hotel@hotelcolima.com</p>
                    <p>100 Smart Street, LA, USA</p>
                    <div class="d-flex">
                        <i class="fab fa-facebook me-3"></i>
                        <i class="fab fa-instagram me-3"></i>
                        <i class="fab fa-linkedin"></i>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
