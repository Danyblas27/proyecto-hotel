<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/dashboard.css">
</head>

<body>
    <header class="row text-white py-3 px-4" style="background-color: #2D6A8A;">
        <div class="d-flex justify-content-between align-items-center w-100">
            <div>
                <div>
                    <img src="../../../assets/img/logo.jpg" alt="logo" width="50" height="50">
                </div>
            </div>
            <div>
                <div>
                    <button class="btn btn-outline-danger" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Navegación en la parte de la izquierda -->
            <nav class="col-md-3 col-lg-2 d-md-block text-white vh-100"
                style="background-color: #2D6A8A; opacity: 75%;">
                <div class="position-sticky pt-3">
                    <h4 class="px-3">Bienvenido</h4>
                    <ul class="nav flex-column px-2" id="mainMenu">
                        <!-- Elementos para todos los roles -->
                        <li class="nav-item menu-item all-roles">
                            <a class="nav-link text-white" href="./dashboard.html">Historial de reservaciones</a>
                        </li>
                        <li class="nav-item menu-item all-roles">
                            <a class="nav-link text-white" href="./reservacion-manual.html">Reservar</a>
                        </li>

                        <!-- Elementos solo para admin -->
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./reportes-ocupacion.html">Reporte de ocupación</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./reportes-venta.html">Reporte de ventas</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./usuario.html">Usuarios</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./habitaciones.html">Habitaciones</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./servicios-adicionales.html">Servicios adicionales</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="ms-md-5">Historial de reservaciones</h2>
                <div class="container mt-4">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Fecha Entrada</th>
                                    <th>Fecha Salida</th>
                                    <th>Estado</th>
                                    <th>Total</th>
                                    <th>Método Pago</th>
                                    <th>Habitación</th>
                                    <th>Registrado por</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="reservationsTableBody">
                                <!-- Los datos se cargarán dinámicamente aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../../assets/js/views/dashboard/historial/historial.js"></script>
    <script type="module" src="./../../../assets/js/logout.js"></script>
</body>

</html>
