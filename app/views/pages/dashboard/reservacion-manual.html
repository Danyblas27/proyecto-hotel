<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Reservación Manual</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../../../assets/css/reservacion-manual.css">
    </head>
    <body>
        <header class="row text-white py-3 px-4" style="background-color: #2D6A8A;">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div>
                    <div>
                        <img src="../../../assets/img/logo.jpg" alt="logo" width="50" height="50">
                    </div>
                </div>
                <div>
                    <div>
                        <button class="btn btn-outline-danger">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="container-fluid">
            <div class="row">
                <!-- Navegación en la parte de la izquierda -->
                <nav class="col-md-3 col-lg-2 d-md-block text-white vh-100" style="background-color: #2D6A8A; opacity: 75%;">
                    <div class="position-sticky pt-3">
                        <h4 class="px-3">Bienvenido</h4>
                        <ul class="nav flex-column px-2">
                            <li class="nav-item">
                                <a class="nav-link text-white active" href="./dashboard.html">Historial de reservaciones</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white " href="./reservacion-manual.html">Reservar</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="./reportes-ocupacion.html">Reporte de ocupación</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white" href="./reportes-venta.html">Reporte de ventas</a>
                            </li>
                        </ul>
                    </div>
                </nav>

                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                    <h2 class="ms-md-5">Reservación Manual</h2>
                    <div class="container my-5 p-4 rounded shadow-sm" style="background-color: #FFFAF0; border: 2px solid #F7A399;">
                        <form class="row g-4" onsubmit="registrar(this); return false;">
                            <h3 class="text-center mb-4">Formulario de Registro y Reservación</h3>
                            <div class="col-md-6">
                                <label for="regEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="Ingresa tu correo" required>
                            </div>
                            <div class="col-md-6">
                                <label for="regName" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="regName" placeholder="Ingresa tu nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label for="regPhone" class="form-label">Número de teléfono</label>
                                <input type="tel" class="form-control" id="regPhone" placeholder="Ingresa tu número de teléfono" required>
                            </div>
                            <div class="col-md-6">
                                <label for="regPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="regPassword" placeholder="Crea una contraseña" required>
                            </div>
                            <div class="col-md-4">
                                <label for="entrada" class="form-label">Fecha de entrada</label>
                                <input type="date" class="form-control" id="entrada" name="entrada" required>
                            </div>
                            <div class="col-md-4">
                                <label for="salida" class="form-label">Fecha de salida</label>
                                <input type="date" class="form-control" id="salida" name="salida" required>
                            </div>
                            <div class="col-md-4">
                                <label for="personas" class="form-label">Número de personas</label>
                                <select class="form-select" id="personas" name="personas" required>
                                    <option selected disabled>Seleccione</option>
                                    <option>1 Persona</option>
                                    <option>2 Personas</option>
                                    <option>3 Personas</option>
                                    <option>4 Personas</option>
                                </select>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn px-5 text-white" style="background-color: #7FC8C2;">
                                    <strong>CONTINUAR / RESERVAR</strong>
                                </button>
                            </div>
                        </form>
                    </div>
                </main>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
