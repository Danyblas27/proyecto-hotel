<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservación Manual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/reservacion-manual.css">
</head>
<body>
    <header class="row text-white py-3 px-4" style="background-color: #2D6A8A;">
        <div class="d-flex justify-content-between align-items-center w-100">
            <img src="../../../assets/img/logo.jpg" alt="logo" width="50" height="50">
            <button class="btn btn-outline-danger" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Navegación lateral -->
            <nav class="col-md-3 col-lg-2 d-md-block text-white vh-100" style="background-color: #2D6A8A; opacity: 75%;">
                <div class="position-sticky pt-3">
                    <h4 class="px-3">Bienvenido</h4>
                    <ul class="nav flex-column px-2" id="mainMenu">
                        <!-- Elementos para todos los roles -->
                        <li class="nav-item menu-item all-roles">
                            <a class="nav-link text-white" href="./dashboard.html">Historial de reservaciones</a>
                        </li>
                        <li class="nav-item menu-item all-roles">
                            <a class="nav-link text-white" href="./reservacion-manual.html">Reservar</a>
                        </li>
                        
                        <!-- Elementos solo para admin -->
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./reportes-ocupacion.html">Reporte de ocupación</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./reportes-venta.html">Reporte de ventas</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./usuario.html">Usuarios</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./habitaciones.html">Habitaciones</a>
                        </li>
                        <li class="nav-item menu-item admin-only">
                            <a class="nav-link text-white" href="./servicios-adicionales.html">Servicios adicionales</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="ms-md-5">Reservación Manual</h2>
                <div class="container my-5 p-4 rounded shadow-sm" style="background-color: #FFFAF0; border: 2px solid #F7A399;">
                    <form class="row g-4" id="registroReservacionForm">
                        <h3 class="text-center mb-4">Formulario de Registro y Reservación</h3>
                        
                        <!-- Datos del Cliente -->
                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="name" placeholder="Nombre(s)" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Apellidos" required>
                        </div>
                        <div class="col-md-6">
                            <label for="country" class="form-label">País de origen</label>
                            <input type="text" class="form-control" id="country" placeholder="País" required>
                        </div>
                        <div class="col-md-6">
                            <label for="codeNumber" class="form-label">Código de país</label>
                            <input type="text" class="form-control" id="codeNumber" placeholder="Ej. 52 para México" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telephoneNumber" class="form-label">Número de teléfono</label>
                            <input type="tel" class="form-control" id="telephoneNumber" placeholder="Número sin código" required>
                        </div>
                        <div class="col-md-6">
                            <label for="typeDocOfficial" class="form-label">Tipo de documento</label>
                            <select class="form-select" id="typeDocOfficial" required>
                                <option value="" disabled selected>Seleccione</option>
                                <option value="INE">INE</option>
                                <option value="Pasaporte">Pasaporte</option>
                                <option value="Licencia">Licencia de conducir</option>
                                <option value="Otro">Otro documento</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="idDocOfficial" class="form-label">Número de documento</label>
                            <input type="text" class="form-control" id="idDocOfficial" placeholder="Número completo" required>
                        </div>
                        
                        <!-- Datos de la Reservación -->
                        <div class="col-md-4">
                            <label for="checkIn" class="form-label">Fecha de entrada</label>
                            <input type="date" class="form-control" id="checkIn" required>
                        </div>
                        <div class="col-md-4">
                            <label for="checkOut" class="form-label">Fecha de salida</label>
                            <input type="date" class="form-control" id="checkOut" required>
                        </div>
                        <div class="col-md-4">
                            <label for="guests" class="form-label">Número de personas</label>
                            <select class="form-select" id="guests" required>
                                <option value="" disabled selected>Seleccione</option>
                                <option value="1">1 Persona</option>
                                <option value="2">2 Personas</option>
                                <option value="3">3 Personas</option>
                                <option value="4">4 Personas</option>
                            </select>
                        </div>
                        
                        <div class="col-12 text-end">
                            <button type="submit" class="btn px-5 text-white" style="background-color: #7FC8C2;">
                                <strong>CONTINUAR / RESERVAR</strong>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../../assets/js/views/dashboard/reservacion/reservacion.js"></script>
</body>
</html>
