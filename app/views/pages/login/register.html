<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/app/assets/css/login/register.css" rel="stylesheet">
</head>

<body class="cuerpo">

    <div class="fondo-home-opaco"></div>

    <div class="contenedor-principal">

        <h1 class="titulo-principal">Registrarse</h1>

        <form class="formulario-registro">
            <div class="grupo-formulario">
                <label for="regEmail" class="etiqueta">Correo electrónico</label>
                <input type="email" id="regEmail" class="entrada" placeholder="Ingresa tu correo" required>
            </div>

            <div class="grupo-formulario">
                <label for="regName" class="etiqueta">Nombre completo</label>
                <input type="text" id="regName" class="entrada" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="grupo-formulario">
                <label for="regPhone" class="etiqueta">Número de teléfono</label>
                <input type="tel" id="regPhone" class="entrada" placeholder="Ingresa tu número de teléfono" required>
            </div>

            <div class="grupo-formulario">
                <label for="regPassword" class="etiqueta">Contraseña</label>
                <input type="password" id="regPassword" class="entrada" placeholder="Crea una contraseña" required>
            </div>

            <button type="button" onclick="registrar(this.form)" class="boton-principal">Continuar</button>
        </form>

        <div class="enlace-alternativo">
            ¿Ya tienes una cuenta? <a href="login.html" class="enlace">Iniciar sesión</a>
        </div>
    </div>

    <script>
        function registrar(form) {
            if (document.getElementById("regEmail").value &&
                document.getElementById("regName").value &&
                document.getElementById("regPhone").value &&
                document.getElementById("regPassword").value) {
                alert("Correctamente creado");
                form.reset();
            } else {
                alert("Completa todos los campos");
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
