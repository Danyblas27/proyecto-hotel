<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- iconos, checar si dejar o quitar. Los de bootstrap no fueron suficientes -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../../../assets/css/reg-formulario.css">
        <title>Registro Maralma</title>
    </head>

    <body>
    <div class="fondo-difuminado"></div>
        <header>
            <nav class="navbar navbar-expand-lg p-3 sticky-top" style="background-color: #2D6A8A;">
                <div class="container-fluid">
                    <a class="navbar-brand text-white fs-5 ms-3" href="#"><img src="../../../assets/img/logo.jpg" alt="logo" width="50" height="50"></a>
                    <!-- Botón del menú hamburguesa -->
                    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <!-- navbar -->
                    <div class="collapse navbar-collapse justify-content-end me-3" id="navbarNav">
                        <ul class="navbar-nav align-items-center gap-lg-3">
                            <li class="nav-item"><a href="#" class="nav-link text-white fs-5">Reservar</a></li>         
                            <li class="nav-item"><a href="#" class="nav-link text-white fs-5">Habitaciones</a> </li>                                
                            <li class="nav-item"><a href="#" class="nav-link text-white fs-5">Servicios adicionales</a></li>                         
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
         
        <main>
            <section class="d-flex justify-content-center align-items-center py-5">
                <div class="card shadow-lg p-4" style="max-width: 800px; width: 100%; border-radius: 1rem;">
                    <h2 class="text-center fw-bold mb-5 text-secondary">Registro al Hotel Maralma</h2>
                    <form id="formRegistro">
                        <div class="container my-4">
                            <div class="row g-3">
                                <!-- Nombre/s -->
                                <div class="col-md-6">
                                   <label for="nombre" class="form-label fs-5">Nombre/s</label>
                                   <input type="text" class="form-control" id="nombre" name="nombre" required>
                                </div>
                                
                                <!-- Apellidos -->
                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label fs-5">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                                </div>

                                <!-- E-mail -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label fs-5">E-mail</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                
                                <!-- Nacionalidad -->
                                <div class="col-md-6">
                                    <label for="nacionalidad" class="form-label fs-5">Nacionalidad</label>
                                    <input type="text" class="form-control" id="nacionalidad" name="nacionalidad" required>
                                </div>
                                
                                <!-- Clave del teléfono -->
                                <div class="col-md-3">
                                    <label for="clave" class="form-label fs-5">Clave del país</label>
                                    <input type="text" class="form-control" id="clave" name="clave" placeholder="+52" required>
                                </div>

                                <!-- Teléfono -->
                                <div class="col-md-9">
                                    <label for="telefono" class="form-label fs-5">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" required>
                                </div>

                                <!-- Tipo de documento oficial -->
                                <div class="col-md-6">
                                    <label for="tipoDocumento" class="form-label fs-5">Tipo de documento oficial</label>
                                    <select class="form-select" id="tipoDocumento" name="tipoDocumento" required>
                                        <option selected disabled value="">Selecciona una opción</option>
                                        <option>Pasaporte</option>
                                        <option>INE/IFE</option>
                                        <option>Licencia de conducir</option>
                                        <option>Otro</option>
                                    </select>
                                </div>

                                <!-- ID del documento -->
                                <div class="col-md-6">
                                    <label for="idDocumento" class="form-label fs-5">ID del documento oficial</label>
                                    <input type="text" class="form-control" id="idDocumento" name="idDocumento" required>
                                </div>

                                <!-- Fecha de entrada -->
                                <div class="col-md-6">
                                    <label for="fechaEntrada" class="form-label fs-5">Fecha de entrada</label>
                                    <input type="date" class="form-control" id="fechaEntrada" name="fechaEntrada" required>
                                </div>

                                <!-- Fecha de salida -->
                                <div class="col-md-6">
                                    <label for="fechaSalida" class="form-label fs-5">Fecha de salida</label>
                                    <input type="date" class="form-control" id="fechaSalida" name="fechaSalida" required>
                                </div>

                                <!-- Número de personas -->
                                <div class="col-md-6">
                                    <label for="numPersonas" class="form-label fs-5">Número de personas</label>
                                    <input type="number" class="form-control" id="numPersonas" name="numPersonas" min="1" max="10" required>
                                </div>

                                <!-- Botón de envío -->
                                <div class="col-12 text-center mt-4">
                                    <button type="submit" class="btn px-5 py-2 fs-5" style="background-color: #7FC8C2">Reservar</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <footer class="p-5 text-white" style="background-color: #2D6A8A;">
            <div class="container">
                <div class="row">
                    <!-- Logo e información -->
                    <div class="col-12 col-md-5 mb-4 mb-md-0">
                        <div><img src="../../../assets/img/logo.jpg" alt="logo" width="50" height="50"></div>
                            <p class="mt-4">
                                Vive el encanto del océano. Descansa con alma.
                            </p>
                    </div>
                    <!-- Sección de enlaces -->
                    <div class="col-12 col-md-3 mb-4 mb-md-0">
                        <h4>Hotel</h4>
                        <p class="mt-2">Sobre nosotros</p>
                        <p>Información legal</p>
                    </div>
                    <!-- Sección de contacto -->
                    <div class="col-12 col-md-4">
                        <h4>Contáctanos</h4>
                        <p class="mt-2">Tel: 3121231122</p>
                        <p>Email: hotel@hotelcolima.com</p>
                        <p>100 Smart Street, LA, USA</p>
                        <div class="d-flex">
                            <i class="fab fa-facebook me-3"></i>
                            <i class="fab fa-instagram me-3"></i>
                            <i class="fab fa-linkedin"></i>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../../assets/js/reg-formulario.js"></script>
    </body>
</html>
